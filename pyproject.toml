[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brainseg"
version = "0.1.0"
description = "PS-OCT brain tissue segmentation and benchmarking"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "Pillow>=10,<13",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
mri = ["antspyx==0.6.3", "nibabel>=5.2,<6", "matplotlib"]
dev = ["pytest", "ruff"]

[project.scripts]
brainseg = "brainseg.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "single"
